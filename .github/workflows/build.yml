name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true
        validate-wrappers: false

    - name: Build Debug APK
      # 用 wrapper 而非镜像预装的 gradle：runner 镜像升到 Gradle 9.7 后，AGP 8.x
      # 依赖的 InternalProblems API 在 9.6.0 已被移除，构建会直接失败。wrapper
      # 把版本锁在仓库里（8.13），镜像升级不再影响构建。
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        # 默认 90 天会让每次 push 的 4 MB debug 包长期堆积，占满 Actions
        # storage 配额；正式产物请发 Release（不计入配额）。
        retention-days: 30