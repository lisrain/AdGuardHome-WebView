name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 固定到具体镜像，避免 ubuntu-latest 迁移时构建环境被动变化
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    # 从 Secrets 还原正式签名材料；未配置时回退到 debug 签名
    - name: Restore signing key
      if: env.KEYSTORE_BASE64 != ''
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        {
          echo "storeFile=$RUNNER_TEMP/release.jks"
          echo "storePassword=$STORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > keystore.properties

    # 用 wrapper 而非镜像预装的 gradle，镜像升级不再影响构建
    - name: Build release APK
      env:
        VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.1' }}
      run: ./gradlew assembleRelease -PversionName="${VERSION_NAME#v}" -PversionCode="${{ github.run_number }}"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v7
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        # 默认 90 天会让每次 push 的包长期堆积，占满 Actions storage 配额
        retention-days: 30

    - name: Publish GitHub release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v3
      with:
        files: app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
