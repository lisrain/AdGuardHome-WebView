name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    # 让每次构建复用同一个 debug 签名，否则新 APK 无法覆盖安装
    - name: Cache debug keystore
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: debug-keystore-v1

    # 用 wrapper 而非镜像预装的 gradle：runner 镜像升级不再影响构建
    - name: Build Debug APK
      env:
        VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.0' }}
      run: ./gradlew assembleDebug -PversionName="$VERSION_NAME" -PversionCode="${{ github.run_number }}"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        # 默认 90 天会让每次 push 的 debug 包长期堆积，占满 Actions storage 配额
        retention-days: 30

    - name: Publish GitHub release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        generate_release_notes: true
