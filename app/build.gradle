plugins {
    id 'com.android.application'
}

// 正式签名信息放在不纳入版本库的 keystore.properties 里，CI 由 Secrets 还原
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'org.adguardhome'
    compileSdk 37

    defaultConfig {
        applicationId "org.adguardhome"
        minSdk 23
        targetSdk 37
        // CI 通过 -PversionName/-PversionCode 注入，本地构建保留默认值
        versionCode((findProperty('versionCode') ?: 49) as int)
        versionName((findProperty('versionName') ?: '1.1') as String)
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 没有正式签名时退回 debug 签名，保证产物始终可以安装
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
}